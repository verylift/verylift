service: verylift
image: verylift/verylift

# Non-root on purpose: harden-vps.sh disables root SSH login (PermitRootLogin no)
# on the target VPS, so Kamal must connect as the hardened admin user instead
# of its default root@22.
ssh:
  user: <%= ENV.fetch("DEPLOY_SSH_USER") %>
<% if ENV["DEPLOY_SSH_KEY"] && !ENV["DEPLOY_SSH_KEY"].empty? %>
  # Optional, per-operator, and deliberately NOT sourced from Bitwarden like
  # the other deploy values — which private key file to use depends on whose
  # machine is running `kamal`, not on shared deploy config. Falls back to
  # normal SSH identity resolution (agent + ~/.ssh/config) when unset.
  keys:
    - <%= ENV.fetch("DEPLOY_SSH_KEY") %>
<% end %>

servers:
  web:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>
    options:
      cap-drop: "ALL"
      security-opt: "no-new-privileges:true"
      read-only: true
      tmpfs: "/tmp:size=64m,mode=1777"
      memory: "1g"
      cpus: "2"
  # Never registered with kamal-proxy (proxy: false) — exists as an exec target
  # for migrate/collectstatic, running with the OWNER Postgres role so that
  # credential never lands in the long-running web container's env. Kamal boots
  # every declared role as a real container regardless of proxy status (there's
  # no boot-exempt role type), so `cmd: sleep infinity` keeps it inert — never
  # runs gunicorn, opens no port — rather than idling on the app's default CMD
  # with owner DB credentials in its env. It still runs continuously between
  # deploys (Kamal's app:boot step keeps every declared role running, with no
  # way to opt one out) — .kamal/hooks/pre-deploy boots it early so its env
  # is staged before migrate/collectstatic run against it, not to make it
  # ephemeral.
  release:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>
    proxy: false
    cmd: "sleep infinity"
    options:
      cap-drop: "ALL"
      security-opt: "no-new-privileges:true"
      read-only: true
      tmpfs: "/tmp:size=64m,mode=1777"
      memory: "1g"
      cpus: "2"
    env:
      secret:
        - DATABASE_URL:OWNER_DATABASE_URL   # overrides the app-role URL below

proxy:
  app_port: 8000
  ssl: false                # Cloudflare Tunnel terminates TLS; kamal-proxy speaks plain HTTP
  host: <%= ENV.fetch("DEPLOY_HOST_NAME") %>
  healthcheck:
    path: /healthz
    interval: 5
    timeout: 5
  run:
    bind_ips:
      - 127.0.0.1            # loopback-only; cloudflared is the only forwarder

registry:
  server: ghcr.io
  username: <%= ENV.fetch("GHCR_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64                # target VPS arch

# Reached over Kamal's private Docker network as host "verylift-db"
# (<service>-<accessory-key>) — no host port publish needed or added.
accessories:
  db:
    image: postgres:16-alpine
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    env:
      clear:
        POSTGRES_DB: verylift
        POSTGRES_USER: verylift
        POSTGRES_APP_USER: verylift_app
      secret:
        - POSTGRES_PASSWORD
        - POSTGRES_APP_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
    files:
      - scripts/db/init-app-role.sh:/docker-entrypoint-initdb.d/init-app-role.sh
    options:
      security-opt: "no-new-privileges:true"
      memory: "512m"
      cpus: "1"
      # Not cap-drop: ALL — postgres's entrypoint starts as root and needs
      # SETUID/SETGID/CHOWN/DAC_OVERRIDE/FOWNER to drop to the postgres user
      # and fix volume ownership (same reasoning as docker-compose.prod.yml).

volumes:
  # Kamal's `volumes:` key is service-wide, not per-role (confirmed: `servers.<role>`
  # has no `volumes` key), so both mounts land on every role including `release` —
  # harmless there since `release` already carries the higher-trust owner DB
  # credential. `staticfiles` is shared between `web` (serves) and `release`
  # (collectstatic writes) so what's collected is what's served, matching
  # docker-compose.prod.yml's staticfiles named volume under read_only. `media`
  # is user-upload content `release` never touches, but can't be scoped out.
  - verylift_staticfiles:/app/staticfiles
  - verylift_media:/app/media

env:
  clear:
    DJANGO_SETTINGS_MODULE: root.settings_prod
    ALLOWED_HOSTS: <%= ENV.fetch("ALLOWED_HOSTS") %>
    GUNICORN_WORKERS: "5"
    # Closed until this deployment is ready for real signups — not a secret,
    # just an operational policy toggle.
    REGISTRATION_OPEN: "False"
  secret:
    - SECRET_KEY
    - FIELD_ENCRYPTION_KEYS
    - DATABASE_URL          # scoped verylift_app role; host is "verylift-db"
    - OIDC_CLIENT_SECRET
    - EMAIL_HOST_PASSWORD

logging:
  options:
    max-size: "10m"

hooks_path: .kamal/hooks
