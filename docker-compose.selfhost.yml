# Self-hosting reference, not what this repo's maintainers run in production
# (that's Kamal — see config/deploy.yml and the README's Deployment section).
# Feel free to deviate from it.
#
# Deliberately monolithic: one `app` container that sets itself up and serves
# traffic, so "start the container" is the entire install. There is no
# separate admin/migration service to discover or invoke — see
# docs/self-hosting.md for the step-by-step walkthrough (including
# Portainer-specific notes).
#
# `app` is the only service `docker compose up` starts by default, and it
# needs zero required config beyond SECRET_KEY/FIELD_ENCRYPTION_KEYS/
# ALLOWED_HOSTS (see example.env) — it runs against a SQLite file on the
# `data` volume below. That's the right choice for a single user or a small
# friend group; it does NOT enable SQLite's WAL mode, so concurrent writes
# from multiple gunicorn workers can occasionally hit "database is locked"
# under real concurrent load (tracked in
# https://github.com/verylift/verylift/issues/16).
#
# Postgres is available as an opt-in `postgres` profile (the `db` service
# below) for larger or multi-user deployments. Unlike the Kamal setup, `app`
# connects to it with the owning role rather than a scoped DML-only one:
# running migrations from the app container is what removes the second
# service, and that requires schema-change rights. The tradeoff is deliberate
# — a compromised app here could alter the schema, not just the rows. Kamal
# keeps the privilege split (config/deploy.yml's `release` role); if you want
# it too, model yours on that instead of this file.
services:
  app:
    image: ghcr.io/verylift/verylift:latest
    # The container installs and upgrades itself on every boot: migrate,
    # collectstatic, and seed_all all run before gunicorn starts, on SQLite and
    # Postgres alike. All three are idempotent, so re-running them each restart
    # is safe (it's what the Kamal pre-deploy hook does on every deploy too);
    # the cost is a few seconds of boot time, and the benefit is that pulling a
    # new image applies its own schema changes with no extra step.
    #
    # `set -e` means a failed migration stops the container rather than letting
    # gunicorn serve a half-migrated database; `restart: unless-stopped` then
    # retries, which is also what rides out a database that is still starting.
    # `exec` hands PID 1 to gunicorn so it still receives Docker's stop signals.
    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo ">> Applying database migrations..."
        python manage.py migrate --noinput
        echo ">> Collecting static files..."
        python manage.py collectstatic --noinput
        echo ">> Seeding reference data..."
        python manage.py seed_all
        echo ">> Setup complete, starting gunicorn."
        exec gunicorn root.wsgi:application -c gunicorn.conf.py
    ports:
      - "8000:8000"
    networks:
      - frontend
      - backend
    # Gunicorn binds unprivileged :8000 and the image already runs as non-root
    # (uid 999), so no capabilities are needed — drop them all with no add-backs.
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    # Read-only root filesystem: a compromised process cannot tamper with the
    # app code or drop persistent files. The only runtime write paths are mounted
    # writable explicitly: /tmp (gunicorn worker heartbeat files) via tmpfs,
    # /app/staticfiles and /app/data via their named volumes (named volumes
    # stay writable under read_only). Precompiled bytecode
    # (UV_COMPILE_BYTECODE=1) means no runtime __pycache__ writes are needed.
    read_only: true
    tmpfs:
      - "/tmp:size=64m,mode=1777"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: root.settings_prod
      # Defaults to the SQLite file on the `data` volume below — no other
      # containers required. Set DATABASE_URL yourself in .env to use Postgres
      # instead: either an external instance, or the bundled `db` service below
      # via `--profile postgres`, e.g.
      # postgres://verylift:<POSTGRES_PASSWORD>@db:5432/verylift
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/db.sqlite3}
      # Pin the gunicorn worker count. gunicorn.conf.py otherwise sizes workers
      # from multiprocessing.cpu_count(), which reports the host's core count and
      # ignores the compose cpus limit below — on a many-core homelab host that
      # would spawn far more workers than the CPU limit can serve. 5 matches the
      # documented 2-core formula (2*2+1).
      GUNICORN_WORKERS: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    volumes:
      - staticfiles:/app/staticfiles
      # User uploads (profile avatars). Distinct from staticfiles: this is
      # runtime-written user content, not collectstatic output, but it needs
      # the same treatment — read_only above means /app/media itself isn't
      # writable without an explicit volume.
      - media:/app/media
      # Default SQLite database file + its journal/WAL sidecar files. Unused
      # (but harmless to leave mounted) when DATABASE_URL points at Postgres.
      - data:/app/data
    # `required: false` is what lets one definition serve both paths: on the
    # default SQLite path `db` isn't started at all and this is a no-op, while
    # under `--profile postgres` it holds `app` until the database is accepting
    # connections, so the migration step above doesn't race it.
    depends_on:
      db:
        condition: service_healthy
        required: false
    # Liveness/readiness probe hits the loopback /healthz endpoint, which checks
    # DB connectivity. Uses python urllib (curl/wget are not guaranteed in the
    # slim image; python always is) and exits non-zero on any status other than
    # 200, so Docker marks the container unhealthy when the app cannot serve or
    # reach the DB.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status==200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # Generous because first boot runs migrate + collectstatic + seed_all
      # (see `command:` above) before gunicorn binds — on a slow NAS/SBC that
      # can take a couple of minutes. Failures inside start_period don't count
      # toward `retries`, so this only delays the first *real* health verdict.
      start_period: 180s
    restart: unless-stopped

  # --- Opt-in Postgres, for larger or multi-user installs: --profile postgres
  # Not started by a plain `docker compose up`. Set DATABASE_URL in .env to the
  # owner-role URL shown above, then:
  #   docker compose -f docker-compose.selfhost.yml --profile postgres up -d
  # `app` waits for this to be healthy and migrates itself, same as on SQLite.
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-verylift}
      POSTGRES_USER: ${POSTGRES_USER:-verylift}
      # No `:?required` here: this file must stay parseable with zero Postgres
      # config set at all, since `db` is optional and docker compose
      # interpolates every service's environment up front regardless of which
      # profile is active. The official postgres image itself refuses to start
      # with an empty password, so an unset value still fails loudly — just at
      # container start, once you've actually opted into this profile, rather
      # than at parse time on the SQLite path where it's irrelevant.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    # Free hardening for the db. NOT cap_drop: ALL — the official Postgres
    # entrypoint starts as root and needs SETUID/SETGID/CHOWN/DAC_OVERRIDE/FOWNER
    # to drop to the postgres user and fix volume ownership; a trimmed cap set is
    # fragile across image updates.
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verylift}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  data:
  staticfiles:
  media:
  postgres_data:

networks:
  # Internal-only network for db<->app traffic. `internal: true` means Docker
  # attaches no gateway, so it is unreachable from the host and from containers
  # not explicitly joined to it — a compromised app cannot pivot to other
  # services on the host via this network, and the db is reachable only here.
  # Harmless to declare when the `postgres` profile isn't in use — an unused
  # Docker network costs nothing at rest.
  backend:
    internal: true
  # Regular bridge network providing outbound egress (Liftosaur, the OIDC provider) and
  # backing the app's published 8000 port for the Pangolin tunnel client.
  frontend: {}
