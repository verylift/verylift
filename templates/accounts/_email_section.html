{% load i18n %}
<!-- Email section -->
<section class="bg-surface-card border border-line-subtle rounded p-6 mb-6 max-w-lg">
  <h2 class="text-lg font-semibold text-content-strong mb-4">{% trans "Email" %}</h2>
  <form
    method="post"
    action="{% url 'accounts:settings' %}"
    hx-post="{% url 'accounts:settings' %}"
    hx-target="closest section"
    hx-swap="outerHTML"
    data-loading-message="{% trans 'Saving email address…' %}">
    {% csrf_token %}
    <input type="hidden" name="form_name" value="email">
    <div class="mb-4">
      <label for="email" class="block text-sm font-medium text-content-body mb-1">
        {% trans "Email address" %}
      </label>
      <input
        type="email"
        id="email"
        name="email"
        value="{{ email }}"
        autocomplete="email"
        class="w-full bg-surface-card text-content-body border border-line rounded px-3 py-2 text-sm focus:outline-none focus:border-accent"
      >
      <p class="mt-1 text-xs text-content-subtle">{% trans "Used only for password resets. Leave it blank to keep no email on file." %}</p>
      {% if email_error %}<p class="mt-1 text-xs text-danger-dark">{{ email_error }}</p>{% endif %}
    </div>
    <button
      type="submit"
      class="bg-accent text-accent-on text-sm font-medium px-4 py-2 rounded hover:bg-accent-hover">
      {% trans "Save Email" %}
    </button>
  </form>
  {% if oob_messages %}{% include "components/_messages_oob.html" %}{% endif %}
</section>
