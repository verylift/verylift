{% load i18n %}
<!-- Language section -->
<section class="card mb-6">
  <h2 class="text-lg font-semibold text-content-strong mb-4">{% trans "language" %}</h2>
  <form method="post" action="{% url 'accounts:settings' %}">
    {% csrf_token %}
    <input type="hidden" name="form_name" value="language">

    <div class="mb-4">
      <label for="language-select" class="block text-sm font-medium text-content-body mb-2">{% trans "preferred language" %}</label>
      <select id="language-select" name="language" class="w-full border border-line-subtle rounded px-3 py-2 text-sm bg-surface-page text-content-body">
        <option value="" {% if not language %}selected{% endif %}>{% trans "Automatic (browser language)" %}</option>
        {% for code, name in languages %}
        <option value="{{ code }}" {% if language == code %}selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </select>
      <p class="mt-1 text-xs text-content-muted">{% trans "Changing this reloads the page in the selected language." %}</p>
    </div>

    <button
      type="submit"
      class="btn-primary">
      {% trans "save language" %}
    </button>
  </form>
</section>
