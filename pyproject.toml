[project]
name = "root"
version = "0.1.0"
description = "very lift - strength training challenge platform"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "django>=6,<7",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "mozilla-django-oidc>=5.0.2",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    "markdown>=3.10.2",
    "django-ratelimit>=4.1",
    "pillow>=12.3.0",
    # zoneinfo otherwise reads the host's tz database. Without this, the set
    # of pinnable timezones (TASK-273) would differ between a dev box and the
    # python:3.12-slim production image, and a zone pinned in dev could
    # silently resolve to UTC in prod.
    "tzdata>=2026.2",
    "cryptography>=49.0.0",
    "sentry-sdk>=2.35",
    "apscheduler>=3.11.3",
    "structlog>=26.1.0",
    "wger-api-client>=2.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.100",
]

[tool.uv]
required-version = ">=0.11,<0.12"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "root.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=. --cov-report=term-missing:skip-covered --cov-fail-under=95"

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "root/settings*.py",
    "root/asgi.py",
    "root/wsgi.py",
    "root/urls.py",
    ".claude/*",
    ".github/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
]
